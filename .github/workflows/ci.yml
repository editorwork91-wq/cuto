name: CUTO Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: cuto-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  edge-function-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install npm dependencies for Deno's npm resolver
        run: npm install
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check authenticated Edge Functions
        run: |
          deno check --no-lock \
            supabase/functions/channel-director/index.ts \
            supabase/functions/recipe-director/index.ts \
            supabase/functions/voice-preview/index.ts \
            supabase/functions/generate-narration/index.ts \
            supabase/functions/modal-render-start/index.ts \
            supabase/functions/modal-render-status/index.ts

  modal-worker-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Modal worker Python syntax
        run: python -m py_compile modal/video_worker.py
