name: Deploy CUTO Modal Video Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cuto-modal-video-worker-deploy
  cancel-in-progress: false

jobs:
  deploy-modal-worker:
    name: Deploy GPU worker to Modal
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal deployment client
        run: python -m pip install --upgrade modal httpx pydantic

      - name: Validate deployment credentials
        shell: bash
        run: |
          if [[ -z "$MODAL_TOKEN_ID" || -z "$MODAL_TOKEN_SECRET" ]]; then
            echo "::error::Add MODAL_TOKEN_ID and MODAL_TOKEN_SECRET in GitHub repository Actions secrets before deploying."
            exit 1
          fi
          python -m py_compile modal/video_worker.py

      - name: Deploy serverless GPU worker
        run: modal deploy modal/video_worker.py
